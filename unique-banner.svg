<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050308" />
      <stop offset="100%" stop-color="#0a0612" />
    </linearGradient>

    <!-- Text Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes floatUp {
        0% { transform: translateY(260px) translateX(0px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(-20px) translateX(25px); opacity: 0; }
      }
      @keyframes floatUpLeft {
        0% { transform: translateY(260px) translateX(0px); opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { transform: translateY(-20px) translateX(-35px); opacity: 0; }
      }
      @keyframes pulseText {
        0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 8px rgba(167,139,250,0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 15px rgba(167,139,250,0.8)); }
      }
      .firefly-1 { animation: floatUp 8s ease-in-out infinite; fill: #A78BFA; filter: url(#glow); }
      .firefly-2 { animation: floatUpLeft 12s ease-in-out infinite 2s; fill: #E8D5B7; filter: url(#glow); }
      .firefly-3 { animation: floatUp 10s ease-in-out infinite 4s; fill: #432874; filter: url(#glow); }
      .firefly-4 { animation: floatUpLeft 15s ease-in-out infinite 1s; fill: #A78BFA; filter: url(#glow); }
      .firefly-5 { animation: floatUp 9s ease-in-out infinite 3s; fill: #E8D5B7; filter: url(#glow); }
      .firefly-6 { animation: floatUpLeft 11s ease-in-out infinite 5s; fill: #A78BFA; filter: url(#glow); }
      
      .name { animation: pulseText 4s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" fill="url(#bgGrad)" />

  <!-- Nature / Firefly Particles -->
  <circle cx="100" cy="0" r="3" class="firefly-1" />
  <circle cx="250" cy="0" r="2" class="firefly-2" />
  <circle cx="400" cy="0" r="4" class="firefly-3" />
  <circle cx="550" cy="0" r="2" class="firefly-4" />
  <circle cx="700" cy="0" r="3" class="firefly-5" />
  <circle cx="150" cy="0" r="4" class="firefly-6" />
  <circle cx="300" cy="0" r="2.5" class="firefly-1" style="animation-delay: 5s;" />
  <circle cx="450" cy="0" r="3" class="firefly-2" style="animation-delay: 7s;" />
  <circle cx="600" cy="0" r="2" class="firefly-3" style="animation-delay: 1s;" />
  <circle cx="750" cy="0" r="3.5" class="firefly-4" style="animation-delay: 6s;" />
  <circle cx="50" cy="0" r="2" class="firefly-5" style="animation-delay: 4s;" />
  <circle cx="350" cy="0" r="3" class="firefly-6" style="animation-delay: 8s;" />

  <!-- Ground / Subtle Nature Silhouettes (Glowing Hills) -->
  <path d="M0,250 Q150,215 400,235 T800,225 L800,250 L0,250 Z" fill="#1a0f2e" opacity="0.7" />
  <path d="M0,250 Q250,205 500,230 T800,215 L800,250 L0,250 Z" fill="#432874" opacity="0.3" />

  <!-- Centered Typography -->
  <g transform="translate(400, 115)" text-anchor="middle">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="800" font-size="44" fill="#E8D5B7" class="name">
      SHIVANSH <tspan fill="#A78BFA">TRIPATHI</tspan>
    </text>
    <text x="0" y="40" font-family="monospace" font-size="14" fill="#A78BFA" opacity="0.9" letter-spacing="3">
      FULL-STACK DEVELOPER • CRITICAL THINKER
    </text>
  </g>

</svg>
